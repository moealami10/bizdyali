<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخل ولا صايب كونت — BizDyali</title>
  <meta name="description" content="صايب الكونت ديال BizDyali باش تصايب الصفحة الفابور ديال المشروع ديالك." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="container topnav">
    <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 36 36" width="26" height="26"><ellipse cx="18" cy="7" rx="12" ry="4" fill="#fff" opacity=".18"/><text x="18" y="24.5" text-anchor="middle" font-family="Fraunces,Georgia,'Times New Roman',serif" font-weight="700" font-size="21" fill="#FFF8E8">B</text><path d="M10 27.4 Q18 29.8 26 26.6" fill="none" stroke="#E7B23C" stroke-width="1.8" stroke-linecap="round"/><circle cx="26.9" cy="25.9" r="1.3" fill="#E7B23C"/></svg></span><span class="logo-word">BizDyali</span></a>
    <div class="links"><a href="index.html">→ رجع للصفحة الرئيسية</a></div>
  </div>

  <main class="app-wrap app-narrow">
    <h1 class="page-title" id="authTitle">صايب الكونت ديالك</h1>
    <p class="page-sub" id="authSub">بدا بـ<strong>14 يوم فابور</strong>. من بعد 100 درهم فالشهر. بلا كارت بنكية.</p>

    <div class="card" style="margin-top:1rem">
      <div class="tabs" role="tablist" aria-label="Account mode">
        <button class="tab" id="tabSignup" role="tab" aria-selected="true">صايب كونت</button>
        <button class="tab" id="tabLogin" role="tab" aria-selected="false">دخل</button>
      </div>
      <div id="authErr" class="form-err" hidden></div>
      <form id="authForm" class="form-grid">
        <label class="field" id="nameField">السمية
          <input type="text" id="authName" placeholder="مثلا: سلمى بناني" autocomplete="name" />
        </label>
        <label class="field">الإيميل
          <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" required dir="ltr" />
        </label>
        <label class="field">الكود السري
          <input type="password" id="authPassword" placeholder="على الأقل 6 دالحروف" autocomplete="current-password" required />
          <span class="hint">نسخة تجريبية: الكونطات محفوظة غير فهاد المتصفح.</span>
        </label>
        <button type="submit" class="btn btn-primary btn-lg" id="authSubmit">صايب الكونت وكمّل ←</button>
      </form>
      <p class="auth-switch" id="authSwitch">عندك كونت؟ <button class="link-btn" id="switchLink" type="button">دخل</button></p>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script>
  (function () {
    BizDyali.seedDemo();
    var params = new URLSearchParams(location.search);
    var next = params.get('next') || 'dashboard.html';
    var mode = params.get('mode') === 'login' ? 'login' : 'signup';
    if (BizDyali.currentUser()) { location.replace(next); return; }

    var tabSignup = document.getElementById('tabSignup');
    var tabLogin = document.getElementById('tabLogin');
    var nameField = document.getElementById('nameField');
    var submit = document.getElementById('authSubmit');
    var title = document.getElementById('authTitle');
    var sub = document.getElementById('authSub');
    var switchLink = document.getElementById('switchLink');
    var err = document.getElementById('authErr');

    function setMode(m) {
      mode = m;
      var signup = m === 'signup';
      tabSignup.setAttribute('aria-selected', signup);
      tabLogin.setAttribute('aria-selected', !signup);
      nameField.style.display = signup ? '' : 'none';
      submit.textContent = signup ? 'صايب الكونت وكمّل ←' : 'دخل ←';
      title.textContent = signup ? 'صايب الكونت ديالك' : 'مرحبا بيك';
      sub.innerHTML = signup
        ? 'بدا بـ<strong>14 يوم فابور</strong>. من بعد 100 درهم فالشهر. بلا كارت بنكية.'
        : 'دخل باش تسيّر الصفحة ديال المشروع ديالك على BizDyali.';
      switchLink.textContent = signup ? 'دخل' : 'صايب كونت';
      document.getElementById('authSwitch').firstChild.textContent = signup ? 'عندك كونت؟ ' : 'جديد على BizDyali؟ ';
      err.hidden = true;
    }
    tabSignup.onclick = function () { setMode('signup'); };
    tabLogin.onclick = function () { setMode('login'); };
    switchLink.onclick = function () { setMode(mode === 'signup' ? 'login' : 'signup'); };

    document.getElementById('authForm').addEventListener('submit', function (e) {
      e.preventDefault();
      err.hidden = true;
      var res = mode === 'signup'
        ? BizDyali.signup(document.getElementById('authName').value, document.getElementById('authEmail').value, document.getElementById('authPassword').value)
        : BizDyali.login(document.getElementById('authEmail').value, document.getElementById('authPassword').value);
      if (res.error) { err.textContent = res.error; err.hidden = false; return; }
      // New signups go to the page creator; returning users to their dashboard.
      var bizName = params.get('biz');
      location.replace(mode === 'signup'
        ? 'create.html' + (bizName ? '?biz=' + encodeURIComponent(bizName) : '')
        : next);
    });

    setMode(mode);
  })();
  </script>
</body>
</html>
